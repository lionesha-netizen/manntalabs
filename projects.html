<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mannta Labs — projects</title>
<meta name="description" content="products and projects incubating under mannta labs.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --ink: #16181a;
    --muted: #6b6f76;
    --line: #e2e0dc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 8vh 24px;
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  .mark {
    height: 40px;
    width: 40px;
    display: block;
    border-radius: 8px;
    margin-bottom: 48px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: clamp(22px, 4vw, 27px);
    letter-spacing: -0.01em;
    margin-bottom: 32px;
  }

  .cursor {
    display: inline-block;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

  .body-copy p {
    font-size: 16px;
    margin-bottom: 14px;
    max-width: 50ch;
  }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 40px 0 24px;
  }

  .links {
    display: flex;
    gap: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .footer-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 1px;
  }

  a:hover {
    color: var(--muted);
    border-color: var(--muted);
  }

  a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }
</style>
</head>
<body>
  <main>
    <a href="/" aria-label="Mannta Labs home">
      <img class="mark" src="logo-mark.png" alt="Mannta Labs">
    </a>

    <h1>projects.<span class="cursor">_</span></h1>

    <div class="body-copy">
      <p>it is an unprecedented moment for builders. mannta labs is bringing to life a decade-old backlog of projects using the arsenal of new tools that make it possible.</p>
      <p>shipping soon. will share here.</p>
    </div>

    <hr>

    <nav class="links">
      <a href="/">home</a>
      <a href="/teamup">for ceos and founders</a>
    </nav>

    <p class="footer-note">© mannta labs inc.</p>
  </main>
</body>
</html>
